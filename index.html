<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17152b"><title>Кармическая звезда</title>
<style>
:root{color-scheme:dark;--bg:#17152b;--panel:#24213d;--muted:#aaa6c5;--accent:#d8b56d;--line:#625a83}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30294b 0,#17152b 58%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;min-height:100vh;padding:24px 16px 36px}.wrap{max-width:520px;margin:auto}.brand{text-align:center;margin:8px 0 24px}.brand .symbol{font-size:34px;color:var(--accent)}h1{font-size:26px;margin:4px 0 8px;letter-spacing:.2px}.sub{color:var(--muted);font-size:14px;line-height:1.45}.card{background:rgba(36,33,61,.94);border:1px solid #403a60;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #09081755}.fields{display:grid;grid-template-columns:.8fr 1.3fr 1.2fr;gap:9px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}select,input{width:100%;min-width:0;background:#17152b;color:#fff;border:1px solid #51496f;border-radius:12px;padding:13px 10px;font-size:16px;outline:none}select:focus,input:focus{border-color:var(--accent)}button{border:0;border-radius:14px;background:linear-gradient(135deg,#e4c47e,#bd9550);color:#211a2b;font-weight:750;font-size:16px;padding:15px;width:100%;margin-top:16px;cursor:pointer}button:active{transform:scale(.99)}.error{color:#ffaaa8;font-size:13px;margin-top:10px;min-height:18px}.result{display:none}.star{width:100%;max-width:360px;display:block;margin:4px auto 12px}.point{fill:#b89457;stroke:#f0d99f;stroke-width:2}.num{font-size:17px;font-weight:800;fill:#201a2c;text-anchor:middle;dominant-baseline:middle}.legend{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;background:#19172e;border:1px solid #393352;padding:10px 12px;border-radius:13px}.number{width:39px;height:39px;display:grid;place-items:center;background:#b89457;color:#201a2c;border-radius:12px;font-weight:800;font-size:18px}.item strong{display:block;font-size:14px}.item small{color:var(--muted);font-size:12px}.secondary{background:#3b3557;color:#fff;border:1px solid #5b527a;margin-top:10px}.foot{text-align:center;color:#817b9e;font-size:11px;margin-top:18px;line-height:1.5}
</style>
</head>
<body><main class="wrap"><header class="brand"><div class="symbol">✧</div><h1>Кармическая звезда</h1><div class="sub">Рассчитайте пять предназначений по дате рождения</div></header>
<section class="card"><div style="font-weight:700;margin-bottom:15px">Введите дату рождения</div><div class="fields"><div><label for="day">День</label><select id="day"></select></div><div><label for="month">Месяц</label><select id="month"></select></div><div><label for="year">Год</label><input id="year" type="number" inputmode="numeric" min="1" max="2026" value="1994" placeholder="Год"></div></div><button id="calc">Рассчитать звезду</button><div class="error" id="error" role="alert"></div></section>
<section class="card result" id="result"><div style="text-align:center;font-weight:750;font-size:19px;margin-bottom:4px">Ваша кармическая звезда</div><div class="sub" id="birthline" style="text-align:center"></div>
<svg class="star" viewBox="0 0 320 280" aria-label="Пятиконечная звезда с пятью арканами"><path d="M160 30 L286 112 L238 250 L82 250 L34 112 Z" fill="none" stroke="var(--line)" stroke-width="2.5"/><path d="M160 30 L238 250 L34 112 L286 112 L82 250 Z" fill="none" stroke="#51496f" stroke-width="1.5"/><g id="points"></g></svg>
<div class="legend" id="legend"></div><button class="secondary" id="again">Рассчитать другую дату</button><button class="secondary" id="share">Поделиться результатом</button></section>
<div class="foot">Расчёт выполнен по заданным правилам приведения чисел к системе 22 арканов. Интерпретации арканов можно добавить отдельным этапом.</div></main>
<script>
const $=id=>document.getElementById(id), months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
for(let d=1;d<=31;d++)$('day').add(new Option(d,d));months.forEach((m,i)=>$('month').add(new Option(m,i+1)));$('day').value='1';$('month').value='1';
function daysInMonth(y,m){return new Date(y,m,0).getDate()}function normalize(n){while(n>22)n=String(n).split('').reduce((s,x)=>s+Number(x),0);return n}
function updateDays(){const y=Number($('year').value),m=Number($('month').value),max=y>0&&y<=2026?daysInMonth(y,m):31,old=Number($('day').value);$('day').innerHTML='';for(let d=1;d<=max;d++)$('day').add(new Option(d,d));$('day').value=String(Math.min(old,max))} $('month').addEventListener('change',updateDays);$('year').addEventListener('input',updateDays);
let shareText='';$('calc').addEventListener('click',()=>{const d=Number($('day').value),m=Number($('month').value),y=Number($('year').value);$('error').textContent='';if(!Number.isInteger(y)||y<1||y>2026){$('error').textContent='Введите корректный год от 1 до 2026.';return}if(d<1||d>daysInMonth(y,m)){$('error').textContent='Проверьте дату рождения.';return}
const a=normalize(d),b=m,c=normalize(String(y).split('').reduce((s,x)=>s+Number(x),0)),f=normalize(a+b+c),e=normalize(a+b+c+f);const vals=[a,b,c,f,e];const names=[['Воздух','Личность'],['Эфир','Духовность'],['Вода','Деньги'],['Огонь','Отношения'],['Земля','Здоровье']];const coords=[{x:34,y:112},{x:160,y:30},{x:286,y:112},{x:238,y:250},{x:82,y:250}];$('points').innerHTML=coords.map((p,i)=>`<circle class="point" cx="${p.x}" cy="${p.y}" r="21"/><text class="num" x="${p.x}" y="${p.y+1}">${vals[i]}</text>`).join('');$('legend').innerHTML=names.map((n,i)=>`<div class="item"><div class="number">${vals[i]}</div><div><strong>${n[0]} — ${n[1]}</strong><small>Аркан ${vals[i]}</small></div></div>`).join('');$('birthline').textContent=`${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${y}`;shareText=`Моя кармическая звезда (${d}.${m}.${y})\n`+names.map((n,i)=>`${n[0]} — ${n[1]}: ${vals[i]} аркан`).join('\n');$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'});
});$('again').addEventListener('click',()=>{$('result').style.display='none';$('error').textContent='';window.scrollTo({top:0,behavior:'smooth'})});$('share').addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:'Моя кармическая звезда',text:shareText});else if(navigator.clipboard){await navigator.clipboard.writeText(shareText);$('share').textContent='Результат скопирован'}else prompt('Скопируйте результат:',shareText)}catch(e){}});
</script></body></html>
